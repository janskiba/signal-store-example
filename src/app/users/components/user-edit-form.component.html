<li class="bg-white rounded-lg border border-blue-300 px-4 py-3 shadow-sm">
    <form (ngSubmit)="submit()" class="flex flex-col sm:flex-row gap-3 items-start sm:items-center">
        <div class="flex-1 flex flex-col sm:flex-row gap-2">
            <input type="text"
                class="flex-1 rounded-md border border-gray-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                [class.border-red-400]="fields.name().invalid() && fields.name().touched()" [formField]="fields.name" />
            <select
                class="rounded-md border border-gray-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                [formField]="fields.role">
                @for (r of roles; track r) {
                <option [value]="r">{{ r }}</option>
                }
            </select>
        </div>
        <div class="flex gap-2">
            <button type="submit"
                class="px-3 py-1.5 rounded-md bg-blue-600 text-white text-sm font-medium hover:bg-blue-700 transition-colors"
                [disabled]="fields().invalid()">
                Save
            </button>
            <button type="button"
                class="px-3 py-1.5 rounded-md border border-gray-300 text-sm text-gray-600 hover:bg-gray-50 transition-colors"
                (click)="cancel()">
                Cancel
            </button>
        </div>
    </form>
</li>
