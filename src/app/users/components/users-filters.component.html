<div class="flex flex-col sm:flex-row gap-3 mb-6">
    <input type="text" placeholder="Search by name…"
        class="flex-1 rounded-lg border border-gray-300 px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        [ngModel]="store.query()" (ngModelChange)="store.setQuery($event)" />

    <div class="flex gap-2 flex-wrap">
        @for (role of roles; track role) {
        <button class="px-3 py-1.5 rounded-full text-sm font-medium border transition-colors"
            [class.bg-blue-600]="store.selectedRole() === role" [class.text-white]="store.selectedRole() === role"
            [class.border-blue-600]="store.selectedRole() === role" [class.bg-white]="store.selectedRole() !== role"
            [class.text-gray-600]="store.selectedRole() !== role"
            [class.border-gray-300]="store.selectedRole() !== role" (click)="store.setRole(role)">
            {{ roleLabel(role) }}
        </button>
        }
    </div>

    <button
        class="px-3 py-1.5 rounded-lg text-sm text-gray-500 hover:text-gray-800 border border-gray-200 hover:border-gray-400 transition-colors"
        (click)="store.resetFilters()">
        Reset
    </button>
</div>
