<li class="flex items-center justify-between bg-white rounded-lg border border-gray-200 px-4 py-3 shadow-sm">
    <div>
        <span class="font-medium text-gray-800">{{ user().name }}</span>
        <span class="ml-2 text-sm text-gray-400">#{{ user().id }}</span>
    </div>
    <div class="flex items-center gap-3">
        <span class="text-xs font-semibold uppercase tracking-wide px-2.5 py-1 rounded-full"
            [class]="roleBadgeClass(user().role)">
            {{ user().role }}
        </span>
        <button class="text-xs text-gray-400 hover:text-blue-600 transition-colors"
            (click)="store.setEditingUser(user().id)">
            Edit
        </button>
    </div>
</li>
